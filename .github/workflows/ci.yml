name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release-lockstep:
    name: Release lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version literals agree
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml version must be X.Y.Z; got ${version}" >&2
            exit 1
          fi

          # The CHANGELOG section is validated at release time, not here,
          # so a version can sit under ## [Unreleased] without breaking CI.
          grep -Fq "\"version\": \"${version}\"" .claude-plugin/plugin.json

          # .mcp.json deliberately does NOT pin a released version: this project is not
          # published, so it launches the checkout with `uv run --directory`. Assert that,
          # rather than a PyPI pin that would fail every build. When distribution starts,
          # this check flips back to `kimi-in-claude==${version}",`.
          if grep -Fq "==" .mcp.json; then
            echo ".mcp.json pins a release, but this project is not published" >&2
            exit 1
          fi
          grep -Fq "kimi-in-claude-mcp" .mcp.json

          echo "Version ${version} is consistent across pyproject.toml and plugin.json"
