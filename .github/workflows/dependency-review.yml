name: Dependency Review

on:
  pull_request:
    branches: [main]

# Read-only: the action inspects the PR's dependency diff via the API.
permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # Dependency review requires GitHub Advanced Security on a PRIVATE repository.
    # Without it the upload step fails with 'Resource not accessible by
    # integration', so skip rather than fail a build for a reason unrelated to the
    # code. This runs automatically once the repo is public.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
